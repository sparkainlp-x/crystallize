<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="Crystallize: a two-minute, offline, synthetic reasoning game about evidence, calibration and replication.">
<title>Crystallize</title>

<style>
:root {
  --bg: #0a1330;
  --bg2: #101c40;
  --panel: #12204a;
  --line: #2a3b6e;
  --text: #eef2ff;
  --muted: #b3bedb;
  --gold: #c9a84c;
  --gold-bright: #e0c36a;
  --cyan: #40d0e0;
  --danger: #ff8a8a;
  --radius: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: radial-gradient(1200px 600px at 50% -10%, #16275a 0%, var(--bg) 60%) fixed;
  color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 12px 24px;
}
.skip { position: absolute; left: -999px; top: 0; background: var(--gold); color: #0a1330; padding: 8px 12px; z-index: 10; }
.skip:focus { left: 8px; top: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top, main, .foot { width: 100%; max-width: 560px; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 0 8px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.7rem; letter-spacing: 0.22em; color: var(--gold); font-weight: 700; }
.tagline { margin: 2px 0 0; color: var(--muted); font-size: 0.95rem; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tag { border: 1px solid var(--cyan); color: var(--cyan); border-radius: 999px; padding: 2px 10px; font-size: 0.72rem; letter-spacing: 0.08em; }
main { outline: none; }
.card { background: linear-gradient(180deg, var(--panel), var(--bg2)); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-top: 10px; }
.card[hidden], [hidden] { display: none !important; }
h2 { margin: 0 0 6px; font-size: 1.2rem; color: var(--gold-bright); }
h3 { margin: 18px 0 6px; font-size: 1rem; color: var(--gold-bright); }
h4 { margin: 0 0 4px; font-size: 1rem; color: var(--cyan); }
p { margin: 8px 0; }
.lead { font-size: 1.05rem; }
.muted { color: var(--muted); }
.small-text { font-size: 0.85rem; }
.beat { color: var(--cyan); font-weight: 600; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btn {
  appearance: none; border: 1px solid var(--line); background: #1a2a5c; color: var(--text); padding: 12px 16px;
  min-height: 44px; border-radius: 10px; font: inherit; cursor: pointer; touch-action: manipulation;
}
.btn:hover { border-color: var(--cyan); }
.btn.primary { background: var(--gold); color: #0a1330; border-color: var(--gold); font-weight: 700; }
.btn.primary:hover { background: var(--gold-bright); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: 0.9rem; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--cyan); outline-offset: 2px; }
.plotwrap { display: flex; justify-content: center; }
.plot { width: 100%; max-width: 420px; aspect-ratio: 1; background: #070e26; border: 1px solid var(--line); border-radius: 10px; }
.plotwrap.small .plot { max-width: 320px; }
.readout p { margin: 2px 0; font-variant-numeric: tabular-nums; }
.budget { height: 6px; background: #070e26; border-radius: 3px; margin: 10px 0; overflow: hidden; }
#budget-fill { height: 100%; width: 0; background: var(--cyan); }
.trace { margin: 6px 0 0; }
.trace svg { width: 100%; height: 36px; background: #070e26; border: 1px solid var(--line); border-radius: 6px; }
.sliderrow { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
input[type=range] { flex: 1; min-height: 44px; accent-color: var(--gold); }
output { min-width: 4ch; text-align: right; font-weight: 700; color: var(--gold-bright); font-variant-numeric: tabular-nums; }
label { display: block; margin-top: 10px; }
blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--cyan); background: #0e1a3d; border-radius: 0 8px 8px 0; }
.verdict { font-weight: 600; }
.scores { width: 100%; border-collapse: collapse; margin: 8px 0; font-variant-numeric: tabular-nums; }
.scores td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.scores td:last-child { text-align: right; white-space: nowrap; }
.scores tr.total td { font-weight: 700; color: var(--gold-bright); border-bottom: 2px solid var(--gold); }
.best { color: var(--cyan); font-weight: 700; }
.lesson { margin-top: 14px; padding: 12px; border: 1px solid var(--gold); border-radius: 10px; background: #0e1a3d; }
.lesson h3 { margin-top: 0; }
pre {
  white-space: pre-wrap; word-break: break-word; background: #070e26; border: 1px solid var(--line); border-radius: 10px;
  padding: 10px; font: 0.9rem/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: var(--text);
}
.stats { list-style: none; margin: 0; padding: 0; color: var(--muted); }
.stats li { padding: 2px 0; }
.modal { position: fixed; inset: 0; background: rgba(4, 8, 20, 0.8); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal-box { max-width: 520px; max-height: 90vh; overflow: auto; background: var(--panel); border: 1px solid var(--gold); border-radius: var(--radius); padding: 18px; }
.foot { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
.foot p { margin: 4px 0; }
@media (prefers-reduced-motion: no-preference) {
  #budget-fill { transition: width 0.25s ease; }
  .card { animation: rise 0.25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media (forced-colors: active) { .btn.primary { border: 2px solid ButtonText; } }
h2:focus, h2[tabindex="-1"]:focus { outline: none; }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the game</a>
<header class="top">
  <div class="brand">
    <h1 id="app-title">CRYSTALLIZE</h1>
    <p id="app-tagline" class="tagline"></p>
  </div>
  <div class="tools">
    <span id="tag-synthetic" class="tag"></span>
    <button id="btn-lang" class="btn small" type="button"></button>
    <button id="btn-help" class="btn small" type="button" aria-haspopup="dialog"></button>
  </div>
</header>

<main id="main" tabindex="-1">
  <section id="s-intro" class="card" aria-labelledby="intro-heading" hidden>
    <h2 id="intro-heading"></h2>
    <p id="intro-mode" class="muted"></p>
    <p id="intro-beat" class="beat" hidden></p>
    <p id="intro-question" class="lead"></p>
    <p id="intro-prior"></p>
    <p id="intro-rules" class="muted"></p>
    <div class="row">
      <button id="btn-start" class="btn primary" type="button"></button>
      <button id="btn-see-result" class="btn" type="button" hidden></button>
    </div>
    <p id="intro-already" class="muted" hidden></p>
  </section>

  <section id="s-play" class="card" aria-labelledby="play-heading" hidden>
    <h2 id="play-heading" class="sr-only"></h2>
    <div class="plotwrap">
      <svg id="plot" class="plot" viewBox="-5 -5 10 10" role="img" aria-labelledby="plot-title" focusable="false">
        <title id="plot-title"></title>
        <g id="plot-grid"></g>
        <g id="plot-pts"></g>
        <g id="plot-axes"></g>
      </svg>
    </div>
    <div class="readout" aria-live="polite">
      <p id="play-n"></p>
      <p id="play-ratio"></p>
      <p id="play-axis"></p>
      <p id="play-cost" class="muted"></p>
    </div>
    <div class="budget" aria-hidden="true"><div id="budget-fill"></div></div>
    <figure class="trace">
      <svg id="trace" viewBox="0 0 120 36" preserveAspectRatio="none" role="img" aria-labelledby="trace-title" focusable="false">
        <title id="trace-title"></title>
        <polyline id="trace-line" fill="none" stroke="#40d0e0" stroke-width="1.2" vector-effect="non-scaling-stroke"></polyline>
      </svg>
    </figure>
    <div class="row">
      <button id="btn-s1" class="btn" type="button" aria-keyshortcuts="s"></button>
      <button id="btn-s5" class="btn" type="button" aria-keyshortcuts="f"></button>
      <button id="btn-commit" class="btn primary" type="button" aria-keyshortcuts="c"></button>
    </div>
    <p id="play-msg" class="muted" aria-live="polite"></p>
    <p id="play-hint" class="muted small-text"></p>
  </section>

  <section id="s-commit" class="card" aria-labelledby="commit-heading" hidden>
    <h2 id="commit-heading"></h2>
    <p id="commit-question" class="lead"></p>
    <label for="commit-slider" id="commit-slider-label"></label>
    <div class="sliderrow">
      <input id="commit-slider" type="range" min="1" max="99" step="1" value="50">
      <output id="commit-value" for="commit-slider"></output>
    </div>
    <p id="commit-note" class="muted"></p>
    <div class="row"><button id="btn-submit-claim" class="btn primary" type="button"></button></div>
  </section>

  <section id="s-review" class="card" aria-labelledby="review-heading" hidden>
    <h2 id="review-heading"></h2>
    <blockquote id="review-says"></blockquote>
    <div class="plotwrap small">
      <svg id="rplot" class="plot" viewBox="-5 -5 10 10" role="img" aria-labelledby="rplot-title" focusable="false">
        <title id="rplot-title"></title>
        <g id="rplot-grid"></g><g id="rplot-pts"></g><g id="rplot-axes"></g>
      </svg>
    </div>
    <p id="review-ratio" class="lead"></p>
    <p id="review-ref" class="muted"></p>
    <p id="review-verdict" class="verdict"></p>
    <label for="review-slider" id="review-slider-label"></label>
    <div class="sliderrow">
      <input id="review-slider" type="range" min="1" max="99" step="1" value="50">
      <output id="review-value" for="review-slider"></output>
    </div>
    <div class="row"><button id="btn-final" class="btn primary" type="button"></button></div>
  </section>

  <section id="s-result" class="card" aria-labelledby="result-heading" hidden>
    <h2 id="result-heading"></h2>
    <div class="plotwrap small">
      <svg id="xplot" class="plot" viewBox="-5 -5 10 10" role="img" aria-labelledby="xplot-title" focusable="false">
        <title id="xplot-title"></title>
        <g id="xplot-grid"></g><g id="xplot-pts"></g><g id="xplot-axes"></g>
      </svg>
    </div>
    <p id="result-truth" class="lead"></p>
    <table class="scores"><tbody id="result-rows"></tbody></table>
    <p id="result-ideal" class="muted"></p>
    <p id="result-best" class="best" hidden></p>
    <article class="lesson" aria-labelledby="lesson-title">
      <h3 id="lesson-heading"></h3>
      <h4 id="lesson-title"></h4>
      <p id="lesson-body"></p>
    </article>
    <h3 id="share-heading"></h3>
    <pre id="share-text" tabindex="0"></pre>
    <div class="row">
      <button id="btn-share" class="btn primary" type="button"></button>
      <button id="btn-challenge" class="btn" type="button"></button>
      <button id="btn-practice" class="btn" type="button"></button>
    </div>
    <p id="result-msg" class="muted" aria-live="polite"></p>
    <p id="result-notcounted" class="muted" hidden></p>
    <h3 id="stats-heading"></h3>
    <ul id="stats-list" class="stats"></ul>
  </section>
</main>

<div id="help" class="modal" role="dialog" aria-modal="true" aria-labelledby="help-heading" hidden>
  <div class="modal-box">
    <h2 id="help-heading"></h2>
    <p id="help-p1"></p><p id="help-p2"></p><p id="help-p3"></p><p id="help-p4"></p><p id="help-p5"></p>
    <button id="btn-help-close" class="btn primary" type="button"></button>
  </div>
</div>

<footer class="foot">
  <p id="footer-privacy"></p>
  <p id="footer-disclaimer"></p>
  <p id="footer-license"></p>
</footer>

<script>
/* Crystallize UI. DOM only; all logic lives in game.js. No network, no trackers. */
(function () {

  var lang = I.isLang(hash.lang) ? hash.lang : (I.isLang(store.lang) ? store.lang : I.detectLang(navigator));

    view: 'intro', mode: 'daily', seed: null, date: today, inst: null, n: 0, p1: null, p2: null,
    rep: null, result: null, beat: null, newBest: false
  };

  function t(key, vars) { return I.t(lang, key, vars); }
  function text(id, key, vars) { $(id).textContent = t(key, vars); }
  function show(view) {

  }
  function focusHeading(id) { var h = $(id); h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: false }); }

  /* ---------- svg helpers ---------- */

  }

  }

      g.appendChild(el('line', { x1: i, y1: -5, x2: i, y2: 5, stroke: '#16244f', 'stroke-width': 0.04 }));
      g.appendChild(el('line', { x1: -5, y1: i, x2: 5, y2: i, stroke: '#16244f', 'stroke-width': 0.04 }));
    }
    g.appendChild(el('line', { x1: -5, y1: 0, x2: 5, y2: 0, stroke: '#2a3b6e', 'stroke-width': 0.06 }));
    g.appendChild(el('line', { x1: 0, y1: -5, x2: 0, y2: 5, stroke: '#2a3b6e', 'stroke-width': 0.06 }));
  }

    opts = opts || {};

    var gp = $(prefix + '-pts'), ga = $(prefix + '-axes');
    clear(gp); clear(ga);
    for (var i = 0; i < n; i++) {
      var x = Math.max(-4.9, Math.min(4.9, pts[i][0])), y = Math.max(-4.9, Math.min(4.9, pts[i][1]));

    text('app-tagline', 'app.tagline');

  function renderReview() {

  function computeResult(inst, n, p1, p2) {

  /* ---------- flow ---------- */
  function newPuzzle(mode, seed, date, beat) {

  function start() {

  }
  function submitClaim() {

  function showStoredResult() {

    } catch (e) { return false; }
  }
  function challengeLink() {
    var best = Math.round(S.result.sc.total);
    return window.location.href.split('#')[0] + G.buildChallengeHash(Object.assign(seedRef(), { best: best, lang: lang }));
  }
  function randomSeed() {
    var s = '';
    var alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
    for (var i = 0; i < 6; i++) s += alphabet.charAt(Math.floor(Math.random() * alphabet.length));
    return 'p' + s;
  }

  /* ---------- events ---------- */
  $('btn-start').addEventListener('click', start);
  $('btn-see-result').addEventListener('click', showStoredResult);
  $('btn-s1').addEventListener('click', function () { sample(1); });
  $('btn-s5').addEventListener('click', function () { sample(5); });
  $('btn-commit').addEventListener('click', commit);
  $('btn-submit-claim').addEventListener('click', submitClaim);
  $('btn-final').addEventListener('click', finalAnswer);
  $('commit-slider').addEventListener('input', function () { showValue('commit-slider', 'commit-value'); });
  $('review-slider').addEventListener('input', function () { showValue('review-slider', 'review-value'); });
  $('btn-share').addEventListener('click', function () { copy($('share-text').textContent, 'result-msg'); });
  $('btn-challenge').addEventListener('click', function () { copy(challengeLink(), 'result-msg'); });
  $('btn-practice').addEventListener('click', function () {
    if (window.history && window.history.replaceState) window.history.replaceState(null, '', window.location.pathname + window.location.search);
    newPuzzle('practice', randomSeed(), today);
  });
  $('btn-lang').addEventListener('click', function () {
    var codes = Object.keys(I.LANGS);
    lang = codes[(codes.indexOf(lang) + 1) % codes.length];
    store.lang = lang; saveStore(); render();
  });
  var lastFocus = null;
  function openHelp() { lastFocus = document.activeElement; $('help').hidden = false; $('btn-help-close').focus(); }
  function closeHelp() { $('help').hidden = true; if (lastFocus) lastFocus.focus(); }
  $('btn-help').addEventListener('click', openHelp);
  $('btn-help-close').addEventListener('click', closeHelp);
  $('help').addEventListener('click', function (e) { if (e.target === $('help')) closeHelp(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('help').hidden) { closeHelp(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || !$('help').hidden) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    var k = e.key.toLowerCase();
    if (S.view === 'play') {
      if (k === 's') sample(1); else if (k === 'f') sample(5); else if (k === 'c') commit();
    }
  });

  /* ---------- boot ---------- */
  function boot() {
    var mode = 'daily', seed = G.dailySeed(today), date = today, beat = null;
    if (hash.seed) {
      if (hash.date === today) { mode = 'daily'; }
      else { mode = 'challenge'; seed = hash.seed; date = hash.date || today; beat = hash.best; }
      if (hash.date === today && hash.best !== null) beat = hash.best;
    }
    newPuzzle(mode, seed, date, beat);
    window.__crystallize = { errors: errors, ready: true };
    document.documentElement.setAttribute('data-ready', '1');
  }
  boot();
})();
</script>
